<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸之心 · 角色管理</title>
<link rel="stylesheet" href="/memory.css">
<link rel="stylesheet" href="/role-editor.css">
<body class="memory-page-body role-page">
<header class="desktop-menubar memory-page-menubar">
  <nav aria-label="应用菜单">
    <a data-chat-link href="/">对话</a>
    <a id="role-memory-link" href="/memory.html">记忆</a>
    <a id="role-archive-menu" href="/roles.html" aria-current="page">角色管理</a>
  </nav>
</header>
<main class="workspace-shell">
  <aside class="workspace-side memory-page-sidebar">
    <h1 class="workspace-side-title">角色管理</h1>
    <nav class="workspace-side-links" aria-label="角色管理">
      <a id="role-archive-link" href="/roles.html">角色档案</a>
      <a id="role-new-link" href="/roles.html?view=new">新建或导入</a>
    </nav>
  </aside>
  <section class="workspace-card memory-page-workspace" aria-labelledby="role-title">
    <div class="role-archive" id="role-archive" hidden>
      <div class="role-archive-surface">
        <header class="role-archive-header">
          <div><h2 id="role-archive-title">人格和表达</h2><p>按角色管理人设、表达和记忆。</p></div>
          <div class="role-source-actions">
            <a class="role-secondary" id="role-create-card" href="/roles.html?view=new">＋ 新建角色卡</a>
            <button type="button" class="role-secondary" id="role-refresh">刷新配置</button>
          </div>
        </header>
        <p class="role-archive-count" id="role-count"></p>
        <p class="role-page-feedback" id="role-archive-feedback" role="status"></p>
        <div class="role-archive-grid" id="role-cards"></div>
      </div>
    </div>
    <div class="role-import-panel" id="role-import-panel" hidden>
      <header class="memory-page-header"><h2 id="role-import-title">新建或导入</h2></header>
      <div class="role-import-body">
        <div class="role-section-tabs" role="group" aria-label="导入方式">
          <button type="button" id="show-yaml-import" aria-pressed="true" aria-controls="yaml-import">YAML 导入</button>
          <button type="button" id="show-manual-import" aria-pressed="false" aria-controls="manual-import">手写导入</button>
        </div>
        <form id="role-import-form">
          <div class="role-profile">
            <img id="import-avatar-preview" src="/default.svg" alt="头像预览">
            <div class="role-field-grid">
              <label>角色名称<input id="import-name" maxlength="60" placeholder="填写角色名，或从文件读取" required></label>
              <label>角色 ID<input id="import-id" maxlength="40" pattern="[a-z][a-z0-9\-]{2,39}" title="用 3–40 位小写字母、数字或短横线，首位为字母" placeholder="填写 ID，手写问卷可留空" spellcheck="false"></label>
              <label>年龄或人生阶段<input id="import-age" maxlength="1600" placeholder="未指定"></label>
              <label>头像<span class="role-file-label">选择图片<input id="import-avatar" type="file" accept="image/png,image/jpeg,image/webp"></span></label>
            </div>
          </div>
          <p class="role-page-feedback role-import-feedback" id="avatar-import-feedback" role="status"></p>
        <section id="yaml-import" class="role-import-source" aria-label="YAML 导入">
          <div class="role-source-actions">
            <button type="button" class="role-primary" id="upload-yaml">导入YAML</button>
            <input type="file" id="yaml-file" accept=".yaml,.yml,application/yaml,text/yaml" hidden>
            <a class="role-secondary" href="/api/template" download="空白角色卡.yaml">下载空白模板</a>
          </div>
          <p class="role-page-feedback role-import-feedback" id="yaml-import-feedback" role="status"></p>
        </section>
        <section id="manual-import" class="role-import-source" aria-label="手写导入" hidden>
          <div class="role-source-actions">
            <button type="button" class="role-secondary" id="upload-txt">导入已填写的 TXT</button>
            <input type="file" id="txt-file" accept=".txt,text/plain" hidden>
            <a class="role-secondary" href="/api/template/handwritten" download="手写角色卡.txt">下载 TXT 模板</a>
            <button type="button" class="role-secondary" id="return-to-questionnaire" hidden>返回问卷</button>
          </div>
          <p class="role-page-feedback role-import-feedback" id="txt-import-feedback" role="status"></p>
          <p class="role-page-feedback role-import-feedback" id="question-load-feedback" role="status"></p>
          <div id="role-questionnaire" class="role-questionnaire" hidden>
            <div class="role-questions" id="required-questions"></div>
            <details class="role-optional-questions">
              <summary>补充问题（选填）</summary>
              <div class="role-questions" id="optional-questions"></div>
            </details>
          </div>
        </section>
          <footer class="role-questionnaire-footer" id="import-footer" hidden>
            <p class="role-page-feedback" id="question-save-feedback" role="status"></p>
            <p class="role-hint role-create-hint" id="yaml-create-hint" hidden>请先导入 YAML 文件</p>
            <button type="submit" class="role-primary" id="save-import">创建角色</button>
          </footer>
        </form>
      </div>
    </div>
    <div class="role-editor-panel" id="role-editor-panel" hidden>
    <header class="memory-page-header">
      <h2 id="role-title">新建或导入</h2>
      <button type="button" class="memory-page-close" id="role-close" aria-label="关闭编辑" hidden>×</button>
    </header>
    <p class="role-page-feedback" id="role-load-error" role="status"></p>
    <form id="role-form" hidden>
      <div class="role-editor-content">
        <div id="card-pane">
          <div class="role-profile">
            <img id="avatar-preview" src="/default.svg" alt="">
            <div class="role-field-grid">
              <label>角色名称<input id="card-name" maxlength="60"></label>
              <label>角色 ID<input id="card-id" maxlength="40" spellcheck="false" aria-describedby="role-id-hint"></label>
              <label>年龄或人生阶段<input id="card-age" maxlength="1600"></label>
              <label>头像<span class="role-file-label">选择图片<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp"></span></label>
            </div>
          </div>
          <p id="role-id-hint" class="role-hint">以小写字母开头，可用小写字母、数字和短横线，共 3–40 位。保存后用于识别该角色的聊天与记忆。</p>
          <div class="role-section-tabs" aria-label="角色卡分类" role="group">
            <button type="button" data-section="identity" aria-controls="role-identity" aria-pressed="true">人设</button>
            <button type="button" data-section="reply" aria-controls="role-reply" aria-pressed="false">回复格式</button>
            <button type="button" data-section="expression" aria-controls="role-expression" aria-pressed="false">补充表达要求</button>
          </div>
          <section class="role-section" id="role-identity" aria-label="人设"></section>
          <section class="role-section" id="role-reply" aria-label="回复格式" hidden></section>
          <section class="role-section" id="role-expression" aria-label="补充表达要求" hidden></section>
        </div>
      </div>
      <footer class="role-action-bar">
        <p class="role-page-feedback" id="role-error" role="status"></p>
        <div class="role-actions">
          <button type="button" class="role-secondary" id="role-cancel" hidden>取消</button>
          <button id="save-role" class="role-primary">保存角色</button>
        </div>
      </footer>
    </form>
    </div>
  </section>
</main>
<dialog class="role-editor-dialog" id="role-dialog" aria-labelledby="role-title"></dialog>
<script type="module" src="/role-editor.mjs"></script>
</body>
</html>
