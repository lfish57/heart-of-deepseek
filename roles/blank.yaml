# 空白角色卡 · 填写说明
#
# 先填用户已确定的设定。暂时没决定的细节可以留空，或记在 identity.unknowns。
# 角色卡写人物自己的性格、说话习惯和相处方式。短答、追问、纠错、事实和记忆边界由应用统一处理。
# 至少填写 id、name、identity.self_description 和 relationship.start。
# 保留字段名与缩进。可选文本留空字符串，可选列表留空列表。
# 卡片最多 24,000 字符，单项文本最多 1,600 字符，每个列表最多 15 条。
# 多行文本使用 YAML 的块标量，正文另起一行并缩进。

# 基本资料

# 兼容版本。保留模板中的版本字符串。
schema_version: "1.0"
# 稳定 ID。3–40 位小写英文字母、数字或短横线，首位为字母。
# 聊天和记忆归属此 ID，创建后保持原值。
id: ""
# 应用里显示的角色名。1–60 字，允许重名，也可以改名。
name: ""
# 可留空。可在界面选 PNG、JPEG 或 WebP。已保存的角色可沿用应用生成的本地头像路径。
avatar: ""

# 第一层 · 人设

identity:
  # 年龄或用户明确设定的人生阶段。未确定时保留默认值。
  age_status: "未指定"
  # 必填。简明说明角色是谁、平时做什么、为何会与用户交流。
  self_description: ""
  # 角色常出现的场景。每项一个场景。
  scenes: []
  # 已确定的外形、背景、偏好等稳定事实。每项只写一件事。
  facts: []
  # 仍待用户确认的设定。每项写一个尚缺的信息。
  unknowns: []

personality:
  # 描述性格如何影响人物的选择。每项包含以下四个非空字段。
  # trait 是性格倾向。when 写何时显现。behavior 写可见的反应。
  # reconsider 写何时调整反应、改主意或停下来。
  traits: []
  # 人物长期想达成的事。当前待办和已发生的成果放在聊天或记忆中。
  goals: []

relationship:
  # 必填。写相识程度、称呼和主动程度。可以补充熟悉后的变化。
  # 已经发生的具体共同经历由实际聊天与记忆承载。
  start: ""

# 第二层 · 回复格式。六项可按需填写。

reply_format:
  # 写角色说话的篇幅和节奏，以及在哪些话题上会自然多说或收住。
  length: ""
  # 有特殊分段习惯时填写。普通对话依完整意思分段。
  paragraphs: ""
  # 写听得出来的口语特点，包括选词、节奏、自称、称呼和情绪如何流露。
  dialogue: ""
  # 写什么情境下会用动作回应，以及动作怎样融入正文。
  actions: ""
  # 写她何时会收起自己的玩笑、动作或口头习惯。
  omit_when: ""
  # 有明确的输出形式要求时填写。普通正文可以留空。
  internal: ""

# 第三层 · 补充表达要求
# 只写由这个角色的性格和关系决定的反应，通用聊天规则由应用负责。
# 每项包含 when、effect、exception 三个非空字段。
# when 写触发情境。effect 写她留意什么、先说什么或会怎么做。
# exception 写情况变化时怎样调整，或何时收住。

expression: []

# 可选正例与反例。需要时可填人物自己的短对白，每项有 user、reply、why 三个非空字段。
# user 是当时的对方发言。reply 是角色的回应。why 说明回应体现的个人特点或问题。
examples: []
counterexamples: []

# 记忆补充。各字段可留空。应用按角色隔离历史和已确认的记忆。

memory_boundary:
  # 角色认识用户时已确认的关系或经历起点。
  start: ""
  # 额外的来源归属约定。把角色经历、用户转述和虚构设定分别描述。
  attribution: ""
  # 额外的事实更正规则。通常沿用应用对最新明确更正的处理。
  correction: ""
