<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸之心 · 本地聊天</title>
<link rel="stylesheet" href="/memory.css">
<link rel="stylesheet" href="/style.css">
<body class="memory-page-body chat-page">
<header class="desktop-menubar memory-page-menubar">
  <nav aria-label="应用菜单">
    <a href="/" class="is-current" aria-current="page">对话</a>
    <a id="open-memory" href="/memory.html">记忆</a>
    <a id="open-role-manager" href="/roles.html">角色管理</a>
  </nav>
  <div class="chat-toolbar"><span id="connection"></span><button type="button" id="settings">设置</button></div>
</header>
<main class="workspace-shell chat-shell">
  <aside class="workspace-side navigation-panel" aria-label="切换对话角色">
    <div class="frosted-card conversations-card">
      <h2>对话</h2>
      <nav id="roles" class="conversation-list" aria-label="角色列表"></nav>
    </div>
  </aside>
  <section class="workspace-card chat-panel" aria-labelledby="name">
    <header class="chat-header">
      <img id="chat-avatar" class="header-avatar" src="/default.svg" alt="">
      <h1 id="name">聊天</h1>
    </header>
    <div id="messages" class="messages" role="log" aria-label="聊天记录" aria-live="off"></div>
    <form id="send" class="composer">
      <div class="composer-field">
        <textarea id="text" maxlength="4000" rows="2" aria-label="消息" placeholder="说点什么…"></textarea>
        <label class="attachment-control">
          <input id="picture" type="file" aria-label="添加图片" accept="image/png,image/jpeg,image/webp">
          <span title="添加图片"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 17l5-5 4 4 4-5 5 6"></path><circle cx="9" cy="8" r="1"></circle></svg></span>
        </label>
      </div>
      <button type="submit" class="send-button" id="send-button">发送</button>
      <span id="attachment-name" class="attachment-name"></span>
      <p id="status" role="status"></p>
    </form>
  </section>
</main>
<dialog id="settings-dialog" class="memory-page-dialog" aria-labelledby="settings-title">
  <header><h2 id="settings-title">模型设置</h2><button type="button" class="memory-page-close" data-close aria-label="关闭">×</button></header>
  <form id="settings-form" class="memory-edit-form">
    <p id="model"></p>
    <p>聊天、图片、角色卡和记忆保存在本机。发送消息时，当前消息、选中的图片和相关上下文会发往 DeepSeek。</p>
    <label>你的 DeepSeek API Key<input name="key" type="password" autocomplete="off" placeholder="sk-…" required></label>
    <div class="memory-form-actions">
      <button type="button" class="memory-action-secondary" data-close>取消</button><button class="memory-action-primary">保存</button>
    </div>
    <p id="settings-error" data-tone="error" role="status"></p>
  </form>
</dialog>
<script type="module" src="/ui.mjs"></script>
</body>
</html>
